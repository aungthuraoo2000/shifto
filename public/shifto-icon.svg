<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f5d50"/>
      <stop offset="100%" stop-color="#204038"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- clock face -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#eef5f2" stroke-width="7"/>

  <!-- hour ticks -->
  <g stroke="#eef5f2" stroke-width="5" stroke-linecap="round">
    <line x1="100" y1="48" x2="100" y2="58"/>
    <line x1="152" y1="100" x2="142" y2="100"/>
    <line x1="100" y1="152" x2="100" y2="142"/>
    <line x1="48" y1="100" x2="58" y2="100"/>
  </g>

  <!-- hands angled like a forward-shift arrow -->
  <line x1="100" y1="100" x2="100" y2="66" stroke="#eef5f2" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="132" y2="82" stroke="#f4a259" stroke-width="7" stroke-linecap="round"/>

  <circle cx="100" cy="100" r="6" fill="#f4a259"/>
</svg>
